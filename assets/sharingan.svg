<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="70%" stop-color="#D00000"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Eye Sclera Border -->
  <circle cx="80" cy="80" r="76" fill="#0B0F1A" stroke="#D00000" stroke-width="2.5"/>

  <!-- Crimson Iris -->
  <circle cx="80" cy="80" r="70" fill="url(#irisGrad)" filter="url(#eyeGlow)"/>

  <!-- Tomoe Connecting Orbit Ring -->
  <circle cx="80" cy="80" r="42" fill="none" stroke="#2B0505" stroke-width="2.2"/>

  <!-- Center Pupil -->
  <circle cx="80" cy="80" r="14" fill="#0B0F1A"/>

  <!-- Rotating 3-Tomoe Group -->
  <g transform="translate(80, 80)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- Tomoe 1 (Top) -->
    <g transform="translate(0, -42) rotate(0)">
      <circle cx="0" cy="0" r="8" fill="#0B0F1A"/>
      <path d="M0,8 C8,10 14,3 12,-6 C10,-2 6,4 0,6 Z" fill="#0B0F1A"/>
    </g>

    <!-- Tomoe 2 (Bottom Right) -->
    <g transform="translate(36.4, 21) rotate(120)">
      <circle cx="0" cy="0" r="8" fill="#0B0F1A"/>
      <path d="M0,8 C8,10 14,3 12,-6 C10,-2 6,4 0,6 Z" fill="#0B0F1A"/>
    </g>

    <!-- Tomoe 3 (Bottom Left) -->
    <g transform="translate(-36.4, 21) rotate(240)">
      <circle cx="0" cy="0" r="8" fill="#0B0F1A"/>
      <path d="M0,8 C8,10 14,3 12,-6 C10,-2 6,4 0,6 Z" fill="#0B0F1A"/>
    </g>
  </g>
</svg>
