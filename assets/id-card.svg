<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="50%" stop-color="#141D2E"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="35%" stop-color="#D00000"/>
      <stop offset="70%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <filter id="chakraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="536" height="176" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Left Avatar Frame -->
  <g transform="translate(22, 25)">
    <!-- Photo Box -->
    <rect x="0" y="0" width="95" height="115" rx="6" fill="#121826" stroke="#FF6A00" stroke-width="1.6"/>
    <!-- Headband metal icon in frame -->
    <rect x="18" y="12" width="58" height="16" rx="3" fill="#94A3B8" stroke="#1E293B" stroke-width="1"/>
    <circle cx="23" cy="20" r="1.5" fill="#1E293B"/>
    <circle cx="71" cy="20" r="1.5" fill="#1E293B"/>
    <path d="M44,22 C42,20 42,18 45,17 C48,16 49,19 47,21" fill="none" stroke="#FF6A00" stroke-width="1.5"/>
    <!-- Shinobi Silhouette -->
    <circle cx="47" cy="56" r="18" fill="#FFD2A8"/>
    <path d="M22,105 C22,82 40,78 47,78 C54,78 72,82 72,105 Z" fill="#FF6A00"/>
    <rect x="36" y="80" width="22" height="6" fill="#1C2E56"/>
    <!-- Rank Pill below photo -->
    <rect x="5" y="122" width="85" height="18" rx="4" fill="#D00000" opacity="0.2"/>
    <rect x="5" y="122" width="85" height="18" rx="4" fill="none" stroke="#D00000" stroke-width="1"/>
    <text x="47.5" y="134" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">GENIN ➔ CHUNIN</text>
  </g>

  <!-- Middle Shinobi Dossier Info -->
  <g transform="translate(138, 30)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Header -->
    <text x="0" y="12" fill="#8E9BB0" font-size="10" font-weight="700" letter-spacing="1">HIDDEN LEAF VILLAGE • SHINOBI DOSSIER</text>
    <text x="0" y="34" fill="#F2E3C0" font-size="20" font-weight="800">Sushrut Kale</text>
    
    <!-- Meta fields -->
    <g transform="translate(0, 52)" font-size="11">
      <text x="0" y="0" fill="#8E9BB0">VILLAGE :</text>
      <text x="70" y="0" fill="#3FA34D" font-weight="700">MIT Academy of Engineering, Pune</text>

      <text x="0" y="18" fill="#8E9BB0">CLASS :</text>
      <text x="70" y="18" fill="#F2E3C0" font-weight="600">2nd Year — CSE (AI &amp; ML)</text>

      <text x="0" y="36" fill="#8E9BB0">SPECIALTY :</text>
      <text x="70" y="36" fill="#00C2FF" font-weight="700">AI/ML Systems × 3D Spatial Engines</text>

      <text x="0" y="54" fill="#8E9BB0">STATUS :</text>
      <text x="70" y="54" fill="#FFD700" font-weight="800">Active Shinobi • S-Rank Grind</text>
    </g>
  </g>

  <!-- Right: 8.9 CGPA Chakra Ring with Animated Glow -->
  <g transform="translate(465, 88)">
    <!-- Outer Glow Wave -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00C2FF" stroke-width="2" opacity="0.4" filter="url(#chakraGlow)">
      <animate attributeName="r" values="46;52;46" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Background Track -->
    <circle cx="0" cy="0" r="42" fill="#0B0F1A" stroke="#1A243B" stroke-width="8"/>

    <!-- Progress Arc (8.9 / 10 = 89% -> Circumference = 2 * pi * 42 = 263.9 -> stroke-dasharray = 234.8, 263.9) -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FF6A00" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="235 264" transform="rotate(-90)">
      <animate attributeName="stroke" values="#FF6A00;#00C2FF;#FFD700;#FF6A00" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Label -->
    <text x="0" y="-3" fill="#F2E3C0" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">8.9</text>
    <text x="0" y="13" fill="#00C2FF" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CHAKRA</text>
    <text x="0" y="24" fill="#8E9BB0" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">CGPA</text>
  </g>
</svg>
