<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="rasCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0FFFF"/>
      <stop offset="55%" stop-color="#7DF9FF"/>
      <stop offset="80%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="rgba(0,194,255,0)"/>
    </radialGradient>
    <filter id="rasGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Pulsing Chakra Halo -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#00C2FF" stroke-width="2" opacity="0.6" filter="url(#rasGlow)">
    <animate attributeName="r" values="95;110;95" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Dense Inner Orb -->
  <circle cx="120" cy="120" r="75" fill="url(#rasCore)" filter="url(#rasGlow)"/>

  <!-- Rapid Clockwise Chakra Swirl -->
  <g transform="translate(120, 120)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 0 0" to="360 0 0" dur="0.4s" repeatCount="indefinite"/>
    <path d="M-60,0 C-60,-40 0,-60 0,0 C0,40 60,60 60,0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-60 C40,-60 60,0 0,0 C-40,0 -60,60 0,60" fill="none" stroke="#7DF9FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="-35" cy="35" r="4" fill="#00C2FF"/>
  </g>

  <!-- Counter-Rotating Inner Micro-Swirl -->
  <g transform="translate(120, 120)">
    <animateTransform attributeName="transform" type="rotate"
      from="360 0 0" to="0 0 0" dur="0.25s" repeatCount="indefinite"/>
    <path d="M-30,-20 C-10,-40 25,-20 20,10 C15,30 -20,25 -25,-5" fill="none" stroke="#E0FFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#rasGlow)"/>
  </g>
</svg>
