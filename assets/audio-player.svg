<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 72" width="720" height="72">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="50%" stop-color="#121828"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="50%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D00000"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Player Frame -->
  <rect x="2" y="2" width="716" height="68" rx="10" fill="url(#pBg)" stroke="url(#pBorder)" stroke-width="1.8"/>

  <!-- Left: Spinning Vinyl Chakra Disc -->
  <g transform="translate(38, 36)">
    <circle cx="0" cy="0" r="22" fill="#161B26" stroke="#00C2FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#243048" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="8" fill="#FF6A00"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <circle cx="12" cy="0" r="2" fill="#7DF9FF"/>
      <circle cx="-12" cy="0" r="2" fill="#7DF9FF"/>
    </g>
  </g>

  <!-- Track Details -->
  <g transform="translate(74, 28)">
    <text x="0" y="0" fill="#F2E3C0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="0.5">⚡ NARUTO: RISE OF A NINJA</text>
    <text x="0" y="16" fill="#FF8C38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">"I Said I'm Naruto!" • Theme of the Main Menu</text>
  </g>

  <!-- Center: Animated Audio Equalizer Bars -->
  <g transform="translate(395, 48)">
    <rect x="0" y="-12" width="3.5" height="12" rx="1.5" fill="#00C2FF">
      <animate attributeName="height" values="8;24;14;30;12;8" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-8;-24;-14;-30;-12;-8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="7" y="-18" width="3.5" height="18" rx="1.5" fill="#7DF9FF">
      <animate attributeName="height" values="14;32;20;10;28;14" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-14;-32;-20;-10;-28;-14" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="-10" width="3.5" height="10" rx="1.5" fill="#FF8C38">
      <animate attributeName="height" values="10;26;34;16;12;10" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-26;-34;-16;-12;-10" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="21" y="-22" width="3.5" height="22" rx="1.5" fill="#FF6A00">
      <animate attributeName="height" values="22;12;36;22;14;22" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-22;-12;-36;-22;-14;-22" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="-16" width="3.5" height="16" rx="1.5" fill="#FFD700">
      <animate attributeName="height" values="16;30;12;26;18;16" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-16;-30;-12;-26;-18;-16" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="35" y="-28" width="3.5" height="28" rx="1.5" fill="#7DF9FF">
      <animate attributeName="height" values="28;14;32;18;34;28" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-28;-14;-32;-18;-34;-28" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="-14" width="3.5" height="14" rx="1.5" fill="#00C2FF">
      <animate attributeName="height" values="14;28;16;32;10;14" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-14;-28;-16;-32;-10;-14" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="49" y="-20" width="3.5" height="20" rx="1.5" fill="#FF6A00">
      <animate attributeName="height" values="20;10;30;16;28;20" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-10;-30;-16;-28;-20" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="-12" width="3.5" height="12" rx="1.5" fill="#FFD700">
      <animate attributeName="height" values="12;24;14;34;18;12" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-12;-24;-14;-34;-18;-12" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="63" y="-24" width="3.5" height="24" rx="1.5" fill="#00C2FF">
      <animate attributeName="height" values="24;16;28;12;30;24" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-16;-28;-12;-30;-24" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right: SINGLE HERO MUTE / SOUND BUTTON -->
  <g transform="translate(560, 18)">
    <rect x="0" y="0" width="138" height="36" rx="8" fill="url(#btnGrad)" filter="url(#pGlow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="138" height="36" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <text x="69" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="0.8" text-anchor="middle">🔊 MUTE / PLAY</text>
  </g>
</svg>
