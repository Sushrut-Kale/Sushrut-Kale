<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170">
  <defs>
    <linearGradient id="fvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="50%" stop-color="#180C14"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="clashBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="45%" stop-color="#7DF9FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D00000"/>
    </linearGradient>
    <filter id="fvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="796" height="166" rx="10" fill="url(#fvBg)" stroke="#D00000" stroke-width="2"/>

  <!-- Left Clash Details -->
  <g transform="translate(36, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="86" height="20" rx="4" fill="#D00000" opacity="0.25"/>
      <rect x="0" y="0" width="86" height="20" rx="4" fill="none" stroke="#D00000" stroke-width="1.2"/>
      <text x="43" y="14" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">S-RANK BOSS</text>
    </g>

    <text x="98" y="16" fill="#D00000" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1">FINAL VALLEY SHOWDOWN CLEARED</text>
    <text x="0" y="48" fill="#F2E3C0" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">Campus Twin — 3D Spatial Navigator</text>
    <text x="0" y="70" fill="#8E9BB0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">WebGL Digital Twin of MITAOE • A* Pathfinding • WebGL Context Loss Recovery</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="138" height="26" rx="5" fill="#121826" stroke="#00C2FF" stroke-width="1.2"/>
      <text x="69" y="17" fill="#00C2FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🕹️ DUAL FPS / ORBIT</text>

      <rect x="148" y="0" width="142" height="26" rx="5" fill="#121826" stroke="#D00000" stroke-width="1.2"/>
      <text x="219" y="17" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">📍 A* CHAKRA TUBES</text>

      <rect x="300" y="0" width="152" height="26" rx="5" fill="#121826" stroke="#FFD700" stroke-width="1.2"/>
      <text x="376" y="17" fill="#FFD700" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔍 FUZZY MESH SEARCH</text>
    </g>
  </g>

  <!-- Right: 3D Wireframe Spatial Node & Energy Convergence -->
  <g transform="translate(620, 24)">
    <!-- 3D Perspective Isometric Cube Mesh -->
    <polygon points="70,15 125,45 70,75 15,45" fill="#0B132B" stroke="#00C2FF" stroke-width="1.6" opacity="0.9"/>
    <polygon points="15,45 70,75 70,135 15,105" fill="#1C1427" stroke="#00C2FF" stroke-width="1.4" opacity="0.7"/>
    <polygon points="70,75 125,45 125,105 70,135" fill="#240D17" stroke="#D00000" stroke-width="1.4" opacity="0.7"/>
    <!-- Wireframe Diagonal Divisions -->
    <line x1="15" y1="45" x2="125" y2="45" stroke="#7DF9FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="70" y1="15" x2="70" y2="135" stroke="#FF6A00" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

    <!-- Clash Shockwave Core -->
    <circle cx="70" cy="75" r="8" fill="#FFFFFF" filter="url(#fvGlow)"/>
    <circle cx="70" cy="75" r="16" fill="none" stroke="#7DF9FF" stroke-width="2">
      <animate attributeName="r" values="10;24;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="75" r="28" fill="none" stroke="#FF6A00" stroke-width="1.5">
      <animate attributeName="r" values="14;34;14" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
