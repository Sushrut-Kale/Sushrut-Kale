<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150">
  <defs>
    <linearGradient id="valleyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="50%" stop-color="#1A0D15"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="50%" stop-color="#D00000"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="756" height="146" rx="10" fill="url(#valleyBg)" stroke="#D00000" stroke-width="2"/>

  <!-- Left Clash Wireframe -->
  <g transform="translate(40, 20)">
    <!-- Title -->
    <text x="0" y="24" fill="#D00000" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="1">⚡ FINAL VALLEY SHOWDOWN • S-RANK CLEARED</text>
    <text x="0" y="44" fill="#F2E3C0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Campus Twin — 3D Interactive Spatial Engine</text>
    <text x="0" y="68" fill="#8E9BB0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">React Three Fiber • A* Pathfinding • WebGL Context Resilience • Real-Time MIT AOE</text>

    <!-- 3 Feature Chips -->
    <g transform="translate(0, 84)">
      <!-- Chip 1: Orbit + FPS -->
      <rect x="0" y="0" width="135" height="26" rx="5" fill="#121826" stroke="#00C2FF" stroke-width="1"/>
      <text x="67.5" y="17" fill="#00C2FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🕹️ DUAL FPS / ORBIT</text>

      <!-- Chip 2: A* Search -->
      <rect x="145" y="0" width="135" height="26" rx="5" fill="#121826" stroke="#D00000" stroke-width="1"/>
      <text x="212.5" y="17" fill="#FF6A00" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">📍 A* ROUTE TUBES</text>

      <!-- Chip 3: Fuse.js -->
      <rect x="290" y="0" width="145" height="26" rx="5" fill="#121826" stroke="#FFD700" stroke-width="1"/>
      <text x="362.5" y="17" fill="#FFD700" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔍 FUZZY MESH SEARCH</text>
    </g>
  </g>

  <!-- Right: 3D Wireframe Waterfall Graphic -->
  <g transform="translate(580, 20)">
    <!-- 3D Cube / Mesh Node -->
    <polygon points="60,20 110,40 60,60 10,40" fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.8"/>
    <polygon points="10,40 60,60 60,110 10,90" fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.6"/>
    <polygon points="60,60 110,40 110,90 60,110" fill="none" stroke="#D00000" stroke-width="1.5" opacity="0.6"/>
    <!-- Animated Glowing Route Curve through the mesh -->
    <path d="M-40,90 Q30,30 60,60 T140,80" fill="none" stroke="url(#streamGrad)" stroke-width="3" filter="url(#meshGlow)">
      <animate attributeName="stroke-dasharray" values="4,4; 8,2; 4,4" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="60" cy="60" r="5" fill="#FFD700">
      <animate attributeName="r" values="4;7;4" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
