<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <radialGradient id="kuramaFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B00"/>
      <stop offset="60%" stop-color="#D00000"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <filter id="kuramaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="460" height="120" rx="8" fill="#0B0F1A"/>

  <!-- Left Fox Eye -->
  <g transform="translate(120, 60)">
    <!-- Eye Socket Flame Glow -->
    <path d="M-90,-5 C-50,-35 40,-25 70,0 C40,25 -50,30 -90,-5 Z" fill="url(#kuramaFlame)" filter="url(#kuramaGlow)"/>
    <!-- Outer Crimson Eye Sclera -->
    <path d="M-80,-5 C-45,-28 35,-20 60,0 C35,20 -45,24 -80,-5 Z" fill="#D00000" stroke="#FF6A00" stroke-width="1.8"/>
    <!-- Blinking Eyelid Mask / Eye Scale -->
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1,1; 1,0.08; 1,1; 1,1; 1,0.08; 1,1"
        keyTimes="0; 0.05; 0.1; 0.6; 0.65; 0.7"
        dur="5s" repeatCount="indefinite"/>
      <!-- Bright Orange Iris -->
      <ellipse cx="-10" cy="-2" rx="32" ry="18" fill="#FF6A00"/>
      <!-- Slit Pupil -->
      <polygon points="-12,-16 -8,-16 -6,14 -14,14" fill="#0B0F1A"/>
      <circle cx="-10" cy="-2" r="3" fill="#FFD700"/>
    </g>
  </g>

  <!-- Right Fox Eye -->
  <g transform="translate(340, 60)">
    <path d="M90,-5 C50,-35 -40,-25 -70,0 C-40,25 50,30 90,-5 Z" fill="url(#kuramaFlame)" filter="url(#kuramaGlow)"/>
    <path d="M80,-5 C45,-28 -35,-20 -60,0 C-35,20 45,24 80,-5 Z" fill="#D00000" stroke="#FF6A00" stroke-width="1.8"/>
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1,1; 1,0.08; 1,1; 1,1; 1,0.08; 1,1"
        keyTimes="0; 0.05; 0.1; 0.6; 0.65; 0.7"
        dur="5s" repeatCount="indefinite"/>
      <ellipse cx="10" cy="-2" rx="32" ry="18" fill="#FF6A00"/>
      <polygon points="12,-16 8,-16 6,14 14,14" fill="#0B0F1A"/>
      <circle cx="10" cy="-2" r="3" fill="#FFD700"/>
    </g>
  </g>

  <!-- Nine-Tails Chakra Flare Title -->
  <text x="230" y="108" fill="#FF6A00" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="2">SEALED NINE-TAILS CHAKRA RESERVE</text>
</svg>
