name: Generate Shinobi Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/generate_stats_svg.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Stats SVGs
        run: |
          python scripts/generate_stats_svg.py

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
